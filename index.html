<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ================= إعدادات SEO السحرية ================= -->
    <title>محول الملفات - تحويل الصور والنصوص الى PDF مجانا</title>
    <meta name="description" content="أسرع أداة عربية مجانية لتحويل الصور (JPG, PNG) والنصوص إلى ملفات PDF و TXT بضغطة زر واحدة. تحويل الصور لبي دي اف بدون برامج وبسرعة فائقة.">
    <meta name="keywords" content="محول ملفات, تحويل الصور الى pdf, تحويل نص الى pdf, تحويل صوره لبي دي اف, كيف احول صوره لملف, برنامج يحول الصور, تحويل jpg الى pdf, دمج الصور في ملف واحد, صنع ملف pdf, محول الصور عربي, تحويل سريع, بدون برامج, تحويل ملفات الجوال, ازوز, مبرمج, تحويل الصور مجانا">
    
    <!-- Meta Tags لوسائل التواصل الاجتماعي -->
    <meta property="og:title" content="محول الملفات - تحويل الصور والنصوص الى PDF">
    <meta property="og:description" content="حول ملفاتك وصورك الآن مجاناً وبسرعة فائقة مع المحول الذكي.">
    <meta property="og:type" content="website">
    <!-- ========================================================== -->

    <!-- Tailwind CSS للتصميم العصري -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome للأيقونات -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- مكتبات التحويل البرمجية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7fa;
            color: #334155;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .active-tab {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .inactive-tab {
            background-color: #f1f5f9;
            color: #64748b;
        }

        .upload-zone {
            border: 3px dashed #cbd5e1;
            transition: all 0.3s ease;
        }

        .upload-zone:hover {
            border-color: #6366f1;
            background-color: #f0f4ff;
        }

        .gradient-text {
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* تحسين منطقة تحويل النص لضمان ظهور الأحرف العربية بشكل صحيح */
        #hiddenContent {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 595px; /* عرض صفحة A4 تقريباً */
            padding: 40px;
            background: white;
            color: black;
            direction: rtl;
            text-align: right;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 18px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <nav class="bg-white shadow-sm py-4 mb-6">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl">
                    <i class="fa-solid fa-file-pdf text-white text-2xl"></i>
                </div>
                <span class="text-2xl font-black gradient-text">محول الملفات</span>
            </div>
            <div class="hidden md:block text-slate-400 font-bold text-sm">
                الإصدار الذكي 2.0
            </div>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="container mx-auto px-4 max-w-4xl flex-grow">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black text-slate-800 mb-4">حوّل ملفاتك <span class="text-indigo-600">بسرعة فائقة</span></h1>
            <p class="text-slate-500 text-lg font-semibold">الأداة الأسهل لتحويل النصوص والصور إلى PDF باحترافية تامة</p>
        </div>

        <!-- Switcher Buttons -->
        <div class="flex justify-center mb-8 bg-slate-200 p-1.5 rounded-2xl w-fit mx-auto shadow-inner">
            <button id="tabText" onclick="switchSection('text')" class="px-10 py-3 rounded-xl font-bold transition-all active-tab">
                <i class="fa-solid fa-file-word ml-2"></i> نصوص
            </button>
            <button id="tabImage" onclick="switchSection('image')" class="px-10 py-3 rounded-xl font-bold transition-all inactive-tab">
                <i class="fa-solid fa-images ml-2"></i> صور
            </button>
        </div>

        <!-- Section: Text To PDF -->
        <div id="sectionText" class="glass-card rounded-3xl p-6 md:p-10 transition-all duration-300">
            <h3 class="text-xl font-bold mb-4 text-slate-700">اكتب أو الصق النص هنا:</h3>
            <textarea id="textInput" class="w-full h-80 p-5 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none text-xl leading-relaxed resize-none bg-white shadow-sm" placeholder="ابدأ بالكتابة هنا..."></textarea>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
                <button onclick="convertTextToPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transform transition hover:-translate-y-1 flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-file-export"></i> تحميل PDF
                </button>
                <button onclick="convertTextToTXT()" class="bg-white border-2 border-indigo-100 text-indigo-600 hover:bg-indigo-50 font-bold py-4 rounded-2xl transition flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-download text-indigo-400"></i> تحميل TXT
                </button>
            </div>
            <!-- Hidden area for PDF generation logic (Modified for Fix) -->
            <div id="hiddenContent"></div>
        </div>

        <!-- Section: Image To PDF -->
        <div id="sectionImage" class="glass-card rounded-3xl p-6 md:p-10 hidden transition-all duration-300">
            <h3 class="text-xl font-bold mb-6 text-slate-700">ارفع الصورة للتحويل الفوري:</h3>
            
            <div class="upload-zone p-16 rounded-3xl text-center cursor-pointer mb-6" onclick="document.getElementById('imageFile').click()">
                <i class="fa-solid fa-cloud-arrow-up text-6xl text-indigo-400 mb-4"></i>
                <p class="text-2xl font-bold text-slate-700">اضغط لاختيار صورة</p>
                <p class="text-slate-400 mt-2 font-semibold">JPG, PNG, WebP</p>
                <input type="file" id="imageFile" class="hidden" accept="image/*" onchange="previewImage(event)">
            </div>

            <div id="previewContainer" class="hidden text-center bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                <p class="text-indigo-600 font-bold mb-4 italic">تم اختيار الصورة بنجاح!</p>
                <img id="imgPreview" class="max-h-80 mx-auto rounded-2xl shadow-md border mb-8" src="">
                <button onclick="convertImageToPDF()" class="w-full md:w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-xl transition flex items-center justify-center gap-2 text-lg mx-auto">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> تحويل الصورة إلى PDF
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-10 mt-16 text-center">
        <p class="font-black text-slate-400 text-lg tracking-widest uppercase">محول الملفات الذكي</p>
        <p class="text-indigo-500 font-bold mt-2">بواسطة المبرمج عزوز © 2026</p>
    </footer>

    <script>
        function switchSection(type) {
            const isText = type === 'text';
            document.getElementById('sectionText').classList.toggle('hidden', !isText);
            document.getElementById('sectionImage').classList.toggle('hidden', isText);
            
            document.getElementById('tabText').className = isText ? 'px-10 py-3 rounded-xl font-bold transition-all active-tab' : 'px-10 py-3 rounded-xl font-bold transition-all inactive-tab';
            document.getElementById('tabImage').className = !isText ? 'px-10 py-3 rounded-xl font-bold transition-all active-tab' : 'px-10 py-3 rounded-xl font-bold transition-all inactive-tab';
        }

        // إصلاح تحويل النصوص للجوال
        function convertTextToPDF() {
            const text = document.getElementById('textInput').value;
            if(!text.trim()) return alert("يرجى كتابة نص أولاً!");
            
            const ghost = document.getElementById('hiddenContent');
            ghost.innerText = text; // استخدام innerText لضمان سلامة الرموز العربية

            const opt = {
                margin: 15,
                filename: 'محول-عزوز-الملكي.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(ghost).save().then(() => {
                ghost.innerText = "";
            });
        }

        function convertTextToTXT() {
            const text = document.getElementById('textInput').value;
            if(!text.trim()) return alert("يرجى كتابة نص أولاً!");
            const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "ملف-نصي-عزوز.txt";
            a.click();
        }

        function previewImage(event) {
            const f = event.target.files[0];
            if (f) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(f);
            }
        }

        // إصلاح أبعاد الصور في الـ PDF للجوال
        function convertImageToPDF() {
            const src = document.getElementById('imgPreview').src;
            if(!src) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            const img = new Image();
            img.src = src;
            img.onload = function() {
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                
                const margin = 10;
                const maxWidth = pageWidth - (margin * 2);
                const maxHeight = pageHeight - (margin * 2);
                
                let width = img.width;
                let height = img.height;
                
                // حساب النسبة لضمان عدم تمدد الصورة
                const ratio = Math.min(maxWidth / width, maxHeight / height);
                width = width * ratio;
                height = height * ratio;

                const x = (pageWidth - width) / 2;
                const y = (pageHeight - height) / 2;

                doc.addImage(img, 'JPEG', x, y, width, height);
                doc.save('صورة-محولة-عزوز.pdf');
            };
        }
    </script>
</body>
</html>
